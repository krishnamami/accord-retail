<svg width="100%" viewBox="0 0 680 850" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Accord Retail Architecture</title>
  <desc>Knowledge base flows through data intake, evidence, decisions, recommendations, report, and feedback loop</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <style>
      .title { font-size: 18px; font-weight: 500; }
      .subtitle { font-size: 12px; font-weight: 400; }
      .box-title { font-size: 14px; font-weight: 500; }
      
      .c-teal { fill: #E1F5EE; stroke: #0F6E56; }
      .c-coral { fill: #FAECE7; stroke: #993C1D; }
      .c-purple { fill: #EEEDFE; stroke: #534AB7; }
      .c-green { fill: #EAF3DE; stroke: #3B6D11; }
      .c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
      
      .text-dark { fill: #2C2C2A; }
      .text-muted { fill: #5F5E5A; }
      
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .feedback-loop { stroke: #888780; stroke-width: 1; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Title -->
  <text class="title text-dark" x="340" y="35" text-anchor="middle">Accord Retail Architecture</text>
  <text class="subtitle text-muted" x="340" y="55" text-anchor="middle">Knowledge base drives the entire pipeline</text>

  <!-- LAYER 1: Intake -->
  <g class="c-teal">
    <rect x="100" y="80" width="480" height="60" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="103" text-anchor="middle">1. Data Intake (SUBMIT_DATA verb)</text>
    <text class="subtitle text-muted" x="340" y="123" text-anchor="middle">Form CSV or Shopify API → Raw business data</text>
  </g>

  <line x1="340" y1="140" x2="340" y2="180" class="arr"/>

  <!-- LAYER 2: Evidence -->
  <g class="c-coral">
    <rect x="100" y="180" width="480" height="70" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="203" text-anchor="middle">2. Evidence Normalization (KB reads 20 types)</text>
    <text class="subtitle text-muted" x="340" y="223" text-anchor="middle">Map fields → revenue_monthly, churn_rate, margin_trend, …</text>
    <text class="subtitle text-muted" x="340" y="238" text-anchor="middle">Set state: present | absent | contradicted</text>
  </g>

  <line x1="340" y1="250" x2="340" y2="290" class="arr"/>

  <!-- LAYER 3: Decision Logic -->
  <g class="c-purple">
    <rect x="80" y="290" width="520" height="80" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="313" text-anchor="middle">3. Decision Engine (ANALYZE verb)</text>
    <text class="subtitle text-muted" x="340" y="333" text-anchor="middle">BOTTLENECK_DIAGNOSIS: reads evidence, detector scoring</text>
    <text class="subtitle text-muted" x="340" y="348" text-anchor="middle">All logic deterministic (same inputs → same outcome) per KB rules</text>
  </g>

  <line x1="340" y1="370" x2="340" y2="410" class="arr"/>

  <!-- LAYER 4: Diagnosis Result -->
  <g class="c-purple">
    <rect x="100" y="410" width="480" height="70" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="433" text-anchor="middle">4. Diagnosis Output</text>
    <text class="subtitle text-muted" x="340" y="453" text-anchor="middle">Outcome: IDENTIFIED (bottleneck name, severity %) or CANNOT_DECIDE</text>
    <text class="subtitle text-muted" x="340" y="468" text-anchor="middle">Stores: evidence cited, confidence, $$ at stake</text>
  </g>

  <line x1="340" y1="480" x2="340" y2="520" class="arr"/>

  <!-- LAYER 5: Recommendations -->
  <g class="c-green">
    <rect x="80" y="520" width="520" height="80" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="543" text-anchor="middle">5. RECOMMENDATION_ASSESSMENT (PROPOSE_ACTIONS verb)</text>
    <text class="subtitle text-muted" x="340" y="563" text-anchor="middle">Reads diagnosis + LTV/CAC/margin context from KB</text>
    <text class="subtitle text-muted" x="340" y="578" text-anchor="middle">Outputs: Top 3 actions ranked by ROI, payback period, measurement framework</text>
  </g>

  <line x1="340" y1="600" x2="340" y2="640" class="arr"/>

  <!-- LAYER 6: Report -->
  <g class="c-gray">
    <rect x="100" y="640" width="480" height="80" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="340" y="663" text-anchor="middle">6. Monthly Report (PUBLISH_REPORT verb)</text>
    <text class="subtitle text-muted" x="340" y="683" text-anchor="middle">Diagnosis + Impact analysis + Top 3 ranked actions + Measurement</text>
    <text class="subtitle text-muted" x="340" y="698" text-anchor="middle">Every number cites evidence source (auditable, governable)</text>
  </g>

  <line x1="340" y1="720" x2="340" y2="760" class="arr"/>

  <!-- LAYER 7: Action & Feedback -->
  <g class="c-green">
    <rect x="80" y="760" width="240" height="70" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="200" y="783" text-anchor="middle">7. Owner Acts</text>
    <text class="subtitle text-muted" x="200" y="803" text-anchor="middle">EXECUTE_ACTION verb</text>
  </g>

  <g class="c-green">
    <rect x="360" y="760" width="240" height="70" rx="8" stroke-width="0.5"/>
    <text class="box-title text-dark" x="480" y="783" text-anchor="middle">8. Record Outcome</text>
    <text class="subtitle text-muted" x="480" y="803" text-anchor="middle">RECORD_OUTCOME verb</text>
  </g>

  <!-- Feedback loop back to Evidence -->
  <path d="M 600 795 L 650 795 L 650 215 L 580 215" class="feedback-loop"/>
  <text class="subtitle text-muted" x="610" y="790" text-anchor="start">Outcome becomes</text>
  <text class="subtitle text-muted" x="610" y="805" text-anchor="start">new Evidence</text>

</svg>
